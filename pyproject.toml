[project]
name = "bfa-mcp"
version = "1.0.0"
description = "Black Flag Alert MCP server — UK company credit intelligence for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.27",
]

[project.scripts]
bfa-mcp = "bfa_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bfa_mcp*"]
